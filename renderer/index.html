<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:;" />
  <title>系统状态</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <canvas class="refract" id="refract" aria-hidden="true"></canvas>
    <div class="glass-surface" aria-hidden="true"></div>
    <header class="titlebar">
      <span class="led" id="led"></span>
      <span class="title">系统状态</span>
      <span class="spacer"></span>
      <button class="icon-btn mode-btn" id="modeBtn" type="button" title="切换显示模式"><span id="modeLabel">标</span></button>
      <button class="icon-btn" id="layoutBtn" type="button" title="切换纵向/横向"><span id="layoutLabel">竖</span></button>
      <button class="icon-btn" id="themeBtn" type="button" title="切换主题"><span id="themeLabel">色</span></button>
      <button class="icon-btn" id="opacityBtn" type="button" title="调节透明度"><span id="opacityLabel">0</span></button>
      <button class="icon-btn" id="btnPin" type="button" title="窗口置顶">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M9.6 1.5 14.5 6.4l-1.3 1.3-1-.3-2.4 2.4.5 2.6-1.2 1.2L5.6 11l-3 3-.7-.7 3-3-2.6-3.5L3.5 5l2.6.5L8.5 3l-.3-1z"
                fill="currentColor"/>
        </svg>
      </button>
      <button class="icon-btn danger" id="btnQuit" type="button" title="隐藏到托盘">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M4.2 3.1 8 6.9l3.8-3.8 1.1 1.1L9.1 8l3.8 3.8-1.1 1.1L8 9.1l-3.8 3.8-1.1-1.1L6.9 8 3.1 4.2z"
                fill="currentColor"/>
        </svg>
      </button>
    </header>

    <main id="rows">
      <!-- CPU -->
      <section class="metric" data-metric="cpu">
        <div class="head">
          <span class="name">CPU</span>
          <span class="val" id="cpuVal">—</span>
        </div>
        <div class="sub" id="cpuSub">正在读取…</div>
        <div class="bar"><i id="cpuBar" style="width:0%"></i></div>
        <canvas class="mini-spark" id="cpuSpark"></canvas>
      </section>

      <!-- 网络 -->
      <section class="metric" data-metric="net">
        <div class="head">
          <span class="name">网络</span>
          <span class="val rate">
            <span class="down">↓<b id="netRx">—</b></span>
            <span class="up">↑<b id="netTx">—</b></span>
          </span>
        </div>
        <div class="sub" id="netSub">—</div>
        <div class="sub" id="netTotal">累计流量：—</div>
        <div class="sub" id="vpnSub">Clash Verge：未检测到 TUN</div>
        <canvas class="spark" id="netSpark"></canvas>
      </section>

      <!-- GPU -->
      <section class="metric" data-metric="gpu">
        <div class="head">
          <span class="name">GPU</span>
          <span class="val" id="gpuVal">—</span>
        </div>
        <div class="sub" id="gpuSub">正在读取…</div>
        <div class="bar"><i id="gpuBar" style="width:0%"></i></div>
        <canvas class="mini-spark" id="gpuSpark"></canvas>
      </section>

      <!-- 内存 -->
      <section class="metric" data-metric="memory">
        <div class="head">
          <span class="name">内存</span>
          <span class="val" id="memoryVal">—</span>
        </div>
        <div class="sub" id="memorySub">正在读取…</div>
        <div class="bar"><i id="memoryBar" style="width:0%"></i></div>
        <canvas class="mini-spark" id="memorySpark"></canvas>
      </section>

      <!-- 运行时间 -->
      <section class="metric" data-metric="uptime">
        <div class="head">
          <span class="name">运行时间</span>
          <span class="val" id="uptimeVal">—</span>
        </div>
        <div class="sub" id="uptimeSub">—</div>
      </section>
    </main>
  </div>

  <script src="refract.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
